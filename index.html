<style>

body{--pc:#F5A20F;--pc-ink:#141414;--pc-tint:#FFF0D2}

*{box-sizing:border-box}
html{font-size:28px;height:100%}
body{margin:0;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  font-family:var(--body);color:var(--black);background:#fff;line-height:1.3;

.bb.skip{flex-basis:100%;background:var(--pale);font-weight:400}

.fb{margin:.4em 0 .2em;padding:.4em .6em;border:3px solid var(--black);background:var(--pale2)}

.chg{border:2px solid var(--black);background:#fff;border-radius:999px;min-height:44px;padding:0 .8em;font-weight:700;margin-top:.3em}
.say{border:2px solid var(--black);background:#fff;border-radius:999px;min-height:44px;padding:0 .8em;font-weight:700}
.stress{font-family:var(--disp);font-weight:700;font-size:min(1.5em,10vw);text-align:center;margin:.2em 0}
.summary{border:3px solid var(--black);border-bottom:8px solid var(--pc);background:var(--pc-tint);padding:.6em .7em;margin:1em 0}

.taskbox{font-size:.9em;background:var(--pc-tint);border-color:var(--black)}
.taskbox .tt::before{content:"\1F449  "}
.taskbox .tf{background:#fff}

.taskbox .tn{font-size:.8em;color:var(--mid);font-weight:700}
.taskbox .tt{font-weight:700;font-size:1.05em}
.taskbox .tf{font-size:.85em;margin-bottom:.25em;padding:.2em .4em}
.taskbox .tf.good{background:var(--or-tint);border-left:6px solid var(--or)}
.taskbox .tf.bad{background:var(--red-tint);border-left:6px solid var(--red)}
.sim{font-size:.62em;border:3px solid var(--black);border-bottom:10px solid var(--pc);background:#fff;overflow:hidden;line-height:1.25;user-select:none;-webkit-user-select:none}
.hit{font:inherit;color:inherit;min-height:44px;min-width:44px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:.2em .5em;border-radius:6px;text-align:left;-webkit-tap-highlight-color:transparent}
.sim .hit{scroll-margin-top:9rem;scroll-margin-bottom:2rem}
.hit.okf{animation:okf .7s}
.hit.nof{animation:nof .6s}
@keyframes okf{0%,60%{background:var(--or);color:var(--black);box-shadow:0 0 0 3px var(--black)}}
@keyframes nof{0%,20%,60%{transform:translateX(-4px);background:#d3d3d3}40%,80%{transform:translateX(4px)}}
.hit.done{box-shadow:inset 0 0 0 3px var(--or)}

.sim.mailsim{font-size:.74em}
.chrome{background:#e4e6eb}
.tabs{display:flex;align-items:flex-end;gap:.2em;padding:.35em .35em 0;min-width:0}

.tabw .hit.tabx{min-width:40px;padding:0}
.tool{display:flex;align-items:center;gap:.1em;padding:.15em .25em .25em;background:#fff;border-bottom:2px solid #d6d9e0}
.tool .hit{padding:0 .3em;font-size:1.15em}

.blank{padding:2em 1em;text-align:center;color:var(--mid)}
/* static page in read part */
.spage{font-size:.8em;border:3px solid var(--black);border-bottom:8px solid var(--pc);margin:.6em 0;background:#fff}

/* results */
.score{font-family:var(--disp);font-weight:700;font-size:2.2em;text-align:center}

@media (min-width:700px){ main{padding:.8rem 1rem 1.4rem} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

    {tag:"Modal", q:"I ___ like to ask for two repairs. (Say what you want, politely.)", opts:["would", "can", "should"], why:"I would like ... is polite."},

  if(P.type === "sim"){ var a = []; for(var i = 0; i < P.tasks.length; i++) a.push(P.id + "t" + i); return a; }
  var b = []; for(var j = 0; j < P.items.length; j++) if(P.items[j].k !== "page") b.push(P.items[j].id); return b;

function load(){
  try{ localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); storeOK = true;
    var raw = localStorage.getItem(KEY); if(raw){ var o = JSON.parse(raw); for(var k in o) if(o.hasOwnProperty(k)) S[k] = o[k]; } }catch(e){ storeOK = false; }

  if(show){ var el = document.getElementById("saved"); el.className = "saved on"; clearTimeout(savedT); savedT = setTimeout(function(){ el.className = "saved"; }, 900); }

function stepOf(P){ return S.step[P.id] || 0; }
function taskSeq(P){
  var n = P.tasks.length;
  if(!P.shuffleTasks) return range(n);
  if(!S.seq[P.id] || S.seq[P.id].length !== n){
    var mid = range(n), head = [], tail = [];
    if(P.keepFirst) head.push(mid.shift());
    if(P.keepLast) tail.push(mid.pop());
    S.seq[P.id] = head.concat(shuffle(mid), tail);
  }
  return S.seq[P.id];
}
function remaining(P){
  if(P.type === "sim") return P.tasks.length - stepOf(P);
  var ks = scored(P), r = 0; for(var i = 0; i < ks.length; i++) if(!S.ans[ks[i]]) r++; return r;
}
function answeredN(P){ var ks = scored(P), n = 0; for(var i = 0; i < ks.length; i++) if(S.ans[ks[i]]) n++; return n; }
function rightN(P){ var ks = scored(P), n = 0; for(var i = 0; i < ks.length; i++) if(S.ans[ks[i]] && S.ans[ks[i]].ok) n++; return n; }
function totals(){ var r = 0, a = 0; for(var i = 0; i < PARTS.length; i++){ r += rightN(PARTS[i]); a += answeredN(PARTS[i]); } return {r:r, a:a}; }

var CUR = null;
function hit(id, label, cls, kids){
  var c = "hit" + (cls ? " " + cls : "");
  if(FLASH && FLASH.id === id) c += FLASH.ok ? " okf" : " nof";
  return h("button", {cls:c, "data-hit":id, "aria-label":label, onclick:function(){ simTap(CUR, id, label); }}, kids);
}
function isTarget(T, id){ if(T.target instanceof Array) return T.target.indexOf(id) > -1; return T.target === id; }
function wrongMsg(id, label, P){
  if(/^w\d/.test(id)){
    for(var i = 0; i < P.tasks.length; i++) if(P.tasks[i].target === id) return "Yes, that is a mistake too. But it is not this one. Read the code again.";
    return "Not that word. Read the hint and look again.";
  }
  if(/^c\d/.test(id)) return "Not the best one. Read them again.";
  if(/^o\d/.test(id)) return "Not that line yet. Read the hint again.";
  return "That is " + label + ". Try again.";
}
function simTap(P, id, label){
  var st = stepOf(P);
  if(st >= P.tasks.length) return;
  var seq = taskSeq(P), ti = seq[st], T = P.tasks[ti], key = P.id + "t" + ti;
  if(isTarget(T, id)){
    if(!S.ans[key]) S.ans[key] = {ok:true, pick:label};
    S.step[P.id] = st + 1; S.fb[P.id] = {ok:true, msg:T.why}; FLASH = {id:id, ok:true};
  } else {
    var other = false;
    if(/^w\d/.test(id)) for(var i = 0; i < P.tasks.length; i++) if(P.tasks[i].target === id) other = true;
    if(!S.ans[key] && !other) S.ans[key] = {ok:false, pick:label};
    S.fb[P.id] = {ok:false, msg:wrongMsg(id, label, P)}; FLASH = {id:id, ok:false};
  }
  save(true); renderKeep();
}
